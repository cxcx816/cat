name: Build Android APK

on:
  workflow_dispatch:      # 手动点击运行
  push:
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            build-essential ccache git

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Build APK
        run: |
          cd pixel-pal-android
          yes | buildozer android debug || true
          yes | buildozer android debug
        env:
          BUILDOZER_ALLOW_ORPHAN: '1'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pixelpal-apk
          path: pixel-pal-android/bin/*.apk
