name: Build Android APK

on:
  workflow_dispatch:      # 手动点击运行
  push:
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # 允许把日志提交回仓库，便于远程排查
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip openjdk-17-jdk \
            autoconf libtool libltdl-dev pkg-config zlib1g-dev \
            libncurses-dev cmake libffi-dev libssl-dev \
            build-essential ccache git

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Build APK
        run: |
          cd pixel-pal-android
          set -o pipefail
          yes | buildozer -v android debug 2>&1 | tee build_log.txt || true
          yes | buildozer -v android debug 2>&1 | tee build_log2.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pixelpal-apk
          path: pixel-pal-android/bin/*.apk

      - name: Save build log to repo
        if: always()
        run: |
          cd pixel-pal-android
          git config user.name "build-log-bot"
          git config user.email "bot@users.noreply.github.com"
          git add build_log.txt build_log2.txt 2>/dev/null || true
          git commit -m "build log [skip ci]" || true
          git push || true
